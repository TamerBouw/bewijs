name: Officiële bestanden van de cursus
description: >
  Zet de officiële tests, test-hulp, data, scripts, het manifest en package.json/package-lock.json van deze
  platformversie over de werkmap van de cursist. De bestanden staan in bestanden/ naast dit bestand en worden
  gemaakt met werk-bij.sh in de root van de platformrepo.
inputs:
  alleen-pad:
    description: "'true': niets kopiëren, alleen het pad naar de bestanden teruggeven (voor de meldjob)"
    default: "false"
outputs:
  pad:
    description: Map met de officiële bestanden van deze platformversie
    value: ${{ steps.pad.outputs.pad }}
runs:
  using: composite
  steps:
    # github.action_path is leeg in de outputs van een composite action; GITHUB_ACTION_PATH in een stap niet.
    - name: Pad naar de officiële bestanden
      id: pad
      shell: bash
      run: echo "pad=$GITHUB_ACTION_PATH/bestanden" >> "$GITHUB_OUTPUT"
    - name: Officiële bestanden zetten
      if: ${{ inputs.alleen-pad != 'true' }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/zet-officieel.sh" "$GITHUB_ACTION_PATH/bestanden" "$GITHUB_WORKSPACE"
